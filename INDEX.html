<!DOCTYPE html>
<html>
    <head>
        <title>My Hobby Cards</title>

    </head>

            <div class="row">

                        <div class="card-body">
                            <h3 class=" card-title text-primary">Drawing</h3>
                            <p class="card-text text-success">I love sketching animals and comic characters</p>
                        </div>
                    </div> 
                </div>
                    
                    <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <div class="card text-center h-100 border-danger ">
                        <div class="card-body">
                            <h3 class=" card-title text-danger">Football</h3>
                            <p class="card-text">I love playing football with my friends</p>
                        </div>
                    </div>
                        </div> 
                        <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <div class="card text-center h-100 border-danger ">
                        <div class="card-body">
                            <h3 class=" card-title text-danger">Reading</h3>
                            <p class="card-text">I love reading books and novels</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </body>
</html>
