<!DOCTYPE html>
<html>
    <head>
        <title>Typography</title>
        <style>
            body{
                background-image: linear-gradient(to bottom,rgb(225, 73, 98),lightpink,white);
                background-repeat: no-repeat;
                font-family: Helvetica;
            }
            .headers{
                text-transform: uppercase;
            }
            #power{
                font-weight: bold;
            }
            .weakness{
                text-decoration: line-through;
            }
            .batch{
                transform: rotate(15deg);
            }
            .circle{
                height: 100px;
                width: 100px;
                border-radius: 50px;
                animation: colorchange 5s infinite;
            }
            @keyframes colorchange {
                0%{background-color: aliceblue;}

                25%{background-color: rgb(228, 72, 98);}

                50%{background-color: lightpink;}
            }
        </style>
    </head>
    <body>
        <h1 class="headers">Thunder Kid</h1>
        <p id="power">The most powerful kid</p>
        <h2 class="headers">Power</h2>
        <p>super speed</p>
        <h2 class="headers">Weakness</h2>
        <p class="weakness">brocoli</p>
        <p class="batch">Top hero</p>
        <div class="circle"></div>

    </body>
</html>
