<!DOCTYPE html>
<html>
    <head>
        <title>Forms in HTML</title>
    </head>
    <body>
        <form>
            <fieldset>
                <legend><b>Profile and Grades</b></legend>

                <input type="Name" id="name" placeholder=" Name"><br>
                <input type="password" id="pass" placeholder=" password"><br>
                <input type="date" id="date" placeholder=" Birthday"><br>
                <label>Gender:</label><br>
                <input type="radio" name="gender" value="M"> M<br>
                <input type="radio" name="gender" value="F"> F<br>
                <label>City:</label><br>
                <input type="checkbox">Islamabad<br>
                <input type="checkbox">Lahore<br>
                <input type="checkbox">Faislabad<br>
                <select>
                    <option value="coding">Coding</option>
                    <option value="Physics">Physics</option>
                    <option value="Maths">Maths</option>
                </select><br>
                <input type="submit" value="Submit">
            

            </fieldset>
        </form>

    </body>
</html>
